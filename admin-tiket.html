<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Ragnarok Fight Club</title>
    <!-- Google Fonts: Cinzel & Rajdhani -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }
        body {
            background-color: #030712; 
            color: #e2e8f0;
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
            padding-top: 100px;
        }

        /* NAVBAR */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background: rgba(3, 7, 18, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 210, 255, 0.2);
            z-index: 1000;
        }

        .nav-logo {
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 2px;
            text-decoration: none;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
        }

        .nav-logo span {
            color: #00d2ff;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            list-style: none;
            align-items: center;
        }

        .nav-links a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: #00d2ff;
        }

        .btn-beranda {
            background: rgba(255, 255, 255, 0.05);
            color: #cbd5e1 !important;
            border: 1px solid #334155;
            padding: 6px 15px;
            border-radius: 2px;
            transition: 0.3s;
        }

        .btn-beranda:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: #94a3b8;
        }

        .btn-cek-tiket {
            background: linear-gradient(135deg, #0052D4, #4364F7);
            color: white !important;
            padding: 6px 15px;
            border-radius: 2px;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.4);
            transition: 0.3s;
            white-space: nowrap;
        }

        .btn-cek-tiket:hover {
            box-shadow: 0 0 18px rgba(0, 210, 255, 0.8);
        }

        /* CONTAINER */
        .admin-container {
            max-width: 1250px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* LOGIN BOX */
        #login-section {
            max-width: 450px;
            margin: 60px auto;
            background: linear-gradient(145deg, rgba(15, 23, 42, 0.95), rgba(3, 7, 18, 0.98));
            border: 2px solid rgba(255, 75, 43, 0.4);
            border-radius: 8px;
            padding: 40px;
            box-shadow: 0 0 30px rgba(255, 75, 43, 0.2);
            text-align: center;
        }

        #login-section h2 {
            font-family: 'Cinzel', serif;
            color: #ff4b2b;
            font-size: 1.8rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        #login-section p {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-family: 'Cinzel', serif;
            font-size: 0.9rem;
            color: #ffffff;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .form-control {
            width: 100%;
            background: #0b1329;
            border: 2px solid #1e293b;
            padding: 12px 15px;
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            border-radius: 4px;
        }

        .form-control:focus {
            outline: none;
            border-color: #ff4b2b;
            box-shadow: 0 0 10px rgba(255, 75, 43, 0.3);
        }

        .btn-login {
            width: 100%;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            border: 2px solid #ff4b2b;
            padding: 12px;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 75, 43, 0.5);
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            box-shadow: 0 0 25px rgba(255, 75, 43, 0.9);
        }

        /* DASHBOARD SECTION */
        #dashboard-section {
            display: none;
        }

        .dash-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .dash-header h2 {
            font-family: 'Cinzel', serif;
            font-size: 2rem;
            color: #00d2ff;
            letter-spacing: 2px;
        }

        .btn-logout {
            background: transparent;
            color: #ff4b2b;
            border: 1px solid #ff4b2b;
            padding: 8px 20px;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            cursor: pointer;
            border-radius: 2px;
            transition: 0.3s;
        }

        .btn-logout:hover {
            background: rgba(255, 75, 43, 0.1);
        }

        /* STATS CARDS AS BUTTONS */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: linear-gradient(145deg, rgba(15, 23, 42, 0.9), rgba(3, 7, 18, 0.95));
            border: 2px solid #1e293b;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: 0.3s;
        }
        .stat-card:hover {
            border-color: #00d2ff;
            transform: translateY(-3px);
        }
        .stat-card.active-filter {
            border-color: #00d2ff;
            background: linear-gradient(145deg, rgba(0, 210, 255, 0.15), rgba(3, 7, 18, 0.95));
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
        }

        .stat-card h3 {
            font-family: 'Cinzel', serif;
            font-size: 0.9rem;
            color: #94a3b8;
            letter-spacing: 1px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .stat-card .stat-number {
            font-size: 2.2rem;
            font-weight: 900;
            color: #ffffff;
            font-family: 'Cinzel', serif;
        }

        .stat-total .stat-number { color: #00d2ff; text-shadow: 0 0 10px rgba(0, 210, 255, 0.4); }
        .stat-pending .stat-number { color: #f5af19; text-shadow: 0 0 10px rgba(245, 175, 25, 0.4); }
        .stat-approved .stat-number { color: #22c55e; text-shadow: 0 0 10px rgba(34, 197, 94, 0.4); }
        .stat-rejected .stat-number { color: #ff4b2b; text-shadow: 0 0 10px rgba(255, 75, 43, 0.4); }

        /* SEARCH BAR SECTION */
        .search-container {
            margin-bottom: 20px;
        }
        .search-input {
            width: 100%;
            background: linear-gradient(145deg, rgba(15, 23, 42, 0.9), rgba(3, 7, 18, 0.95));
            border: 2px solid #1e293b;
            padding: 14px 20px;
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            border-radius: 8px;
            transition: 0.3s;
        }
        .search-input:focus {
            outline: none;
            border-color: #00d2ff;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
        }

        /* TABLE STYLING */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            background: linear-gradient(145deg, rgba(15, 23, 42, 0.9), rgba(3, 7, 18, 0.95));
            border: 2px solid rgba(0, 210, 255, 0.3);
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            white-space: nowrap;
        }

        th, td {
            padding: 15px 20px;
            border-bottom: 1px solid #1e293b;
        }

        th {
            background-color: #0b1329;
            color: #00d2ff;
            font-family: 'Cinzel', serif;
            font-size: 0.95rem;
            letter-spacing: 1px;
        }

        td {
            color: #cbd5e1;
            font-size: 1.05rem;
        }

        .badge-pending {
            background: rgba(245, 175, 25, 0.15);
            color: #f5af19;
            border: 1px solid #f5af19;
            padding: 4px 10px;
            border-radius: 2px;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .badge-approved {
            background: rgba(0, 210, 255, 0.15);
            color: #00d2ff;
            border: 1px solid #00d2ff;
            padding: 4px 10px;
            border-radius: 2px;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .badge-rejected {
            background: rgba(255, 75, 43, 0.15);
            color: #ff4b2b;
            border: 1px solid #ff4b2b;
            padding: 4px 10px;
            border-radius: 2px;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .badge-terpakai {
            background: rgba(168, 85, 247, 0.15);
            color: #c084fc;
            border: 1px solid #c084fc;
            padding: 4px 10px;
            border-radius: 2px;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-action {
            background: linear-gradient(135deg, #0052D4, #4364F7);
            color: white;
            border: none;
            padding: 6px 12px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            border-radius: 2px;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
            transition: 0.3s;
        }
        .btn-action:hover {
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.6);
        }

        .btn-reject {
            background: linear-gradient(135deg, #f5af19, #f2709c);
            color: white;
            border: none;
            padding: 6px 12px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            border-radius: 2px;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
            transition: 0.3s;
        }
        .btn-reject:hover {
            box-shadow: 0 0 10px rgba(245, 175, 25, 0.6);
        }

        .btn-delete {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 6px 12px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            border-radius: 2px;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
            transition: 0.3s;
        }
        .btn-delete:hover {
            box-shadow: 0 0 10px rgba(255, 75, 43, 0.8);
        }

        .link-bukti {
            color: #00d2ff;
            text-decoration: none;
            font-weight: 700;
        }
        .link-bukti:hover {
            text-decoration: underline;
        }

        /* --- TAMPILAN MOBILE (HP) --- */
        @media (max-width: 768px) {
            nav {
                padding: 12px 15px;
                flex-direction: column;
                gap: 10px;
                align-items: center;
            }

            .nav-logo {
                font-size: 1.2rem;
            }

            .nav-links {
                display: flex;
                gap: 10px;
                list-style: none;
                width: 100%;
                justify-content: center;
                align-items: center;
            }

            .nav-links a {
                font-size: 0.75rem;
                padding: 5px 10px !important;
                white-space: nowrap;
            }

            /* STATS CONTAINER DI HP: DIBUAT BISA DIGESER HORIZONTAL / BERJAJAR KESAMPING */
            .stats-container {
                display: flex;
                flex-direction: row;
                overflow-x: auto;
                gap: 10px;
                padding-bottom: 8px;
                -webkit-overflow-scrolling: touch;
                scroll-snap-type: x mandatory;
            }

            .stats-container::-webkit-scrollbar {
                display: none;
            }

            .stat-card {
                min-width: 42vw;
                max-width: 42vw;
                padding: 12px 10px;
                scroll-snap-align: center;
                flex-shrink: 0;
            }

            .stat-card h3 {
                font-size: 0.75rem;
                margin-bottom: 4px;
            }

            .stat-card .stat-number {
                font-size: 1.6rem;
            }

            .dash-header h2 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav>
        <a href="index.html" class="nav-logo">RFC <span>ARENA</span></a>
        <ul class="nav-links">
            <li><a href="index.html" class="btn-beranda">Beranda</a></li>
            <li><a href="cek-tiket.html" class="btn-cek-tiket">Cek Tiket Masuk 🔍</a></li>
        </ul>
    </nav>

    <div class="admin-container">

        <!-- KOTAK LOGIN ADMIN -->
        <div id="login-section">
            <h2>AREA TERLARANG</h2>
            <p>Verifikasi Akses Pengurus RFC</p>
            
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">Username Admin</label>
                    <input type="text" id="username" class="form-control" placeholder="Masukkan username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Masukkan password" required>
                </div>

                <div class="form-group">
                    <label for="rokok">Rokok Terbaik?</label>
                    <input type="text" id="rokok" class="form-control" placeholder="Merk rokok andalan..." required>
                </div>

                <button type="submit" class="btn-login">Masuk Dashboard</button>
            </form>
        </div>

        <!-- DASHBOARD ADMIN -->
        <div id="dashboard-section">
            <div class="dash-header">
                <h2>Verifikasi Tiket Penonton</h2>
                <button class="btn-logout" onclick="handleLogout()">Keluar</button>
            </div>

            <!-- STATS CARDS AS FILTER BUTTONS -->
            <div class="stats-container">
                <div class="stat-card stat-total active-filter" id="card-all" onclick="setFilter('all')">
                    <h3>Total Pendaftar</h3>
                    <div class="stat-number" id="count-total">0</div>
                </div>
                <div class="stat-card stat-pending" id="card-pending" onclick="setFilter('pending')">
                    <h3>Belum Direspon</h3>
                    <div class="stat-number" id="count-pending">0</div>
                </div>
                <div class="stat-card stat-approved" id="card-approved" onclick="setFilter('approved')">
                    <h3>Disetujui (Approved)</h3>
                    <div class="stat-number" id="count-approved">0</div>
                </div>
                <div class="stat-card stat-rejected" id="card-rejected" onclick="setFilter('rejected')">
                    <h3>Ditolak</h3>
                    <div class="stat-number" id="count-rejected">0</div>
                </div>
            </div>

            <!-- SEARCH BAR -->
            <div class="search-container">
                <input type="text" id="search-input" class="search-input" placeholder="🔍 Cari berdasarkan 4 digit terakhir kode tiket (misal: 7771) atau nama penonton..." oninput="filterDataTabel()">
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Waktu Beli</th>
                            <th>Nama Lengkap</th>
                            <th>No WhatsApp</th>
                            <th>Bukti Transfer</th>
                            <th>Status</th>
                            <th>Kode Tiket</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="ticket-table-body">
                        <tr>
                            <td colspan="7" style="text-align: center; color: #94a3b8;">Memuat data tiket...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- JAVASCRIPT LOGIC ADMIN -->
    <script>
        const URL_WEB_APP = "https://script.google.com/macros/s/AKfycbwUVs1oMee7KhKtbz_9XFITFLr3NWOB5TCGebITyyeMJvEUCWXiPTM9adcm1jDf9pLG/exec";

        let allTickets = [];
        let currentFilter = 'all';

        window.onload = function() {
            if (localStorage.getItem("rfc_admin_logged") === "true") {
                bukaDashboard();
            }
        };

        function handleLogin(event) {
            event.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const rokok = document.getElementById('rokok').value.trim().toLowerCase();

            // Kredensial disamarkan (Encoded Base64) agar tidak terlihat langsung di GitHub
            // Asli:
            const encodedUser = "YW1ib24="; 
            const encodedPass = "ZGlja2Jvbg==";
            const encodedRokok = "Y2FtZWw=";

            // Fungsi dekoder sederhana
            const decode = (str) => atob(str);

            if (user === decode(encodedUser) && pass === decode(encodedPass) && rokok === decode(encodedRokok)) {
                localStorage.setItem("rfc_admin_logged", "true");
                bukaDashboard();
            } else {
                alert("Verifikasi gagal! Pastikan semua kolom terisi dengan benar.");
            }
        }

        function bukaDashboard() {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('dashboard-section').style.display = 'block';
            muatDataTiket();
        }

        function handleLogout() {
            localStorage.removeItem("rfc_admin_logged");
            document.getElementById('dashboard-section').style.display = 'none';
            document.getElementById('login-section').style.display = 'block';
            document.getElementById('username').value = "";
            document.getElementById('password').value = "";
            document.getElementById('rokok').value = "";
        }

        async function muatDataTiket() {
            const tbody = document.getElementById('ticket-table-body');
            try {
                const response = await fetch(URL_WEB_APP);
                allTickets = await response.json();

                updateStatsCount();
                renderTable();

            } catch (error) {
                console.error("Gagal memuat data:", error);
                tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: #ff4b2b;">Gagal terhubung ke database. Periksa URL Web App.</td></tr>`;
            }
        }

        function updateStatsCount() {
            let total = allTickets.length;
            let pending = 0;
            let approved = 0;
            let rejected = 0;

            allTickets.forEach(t => {
                if (t.status === "Approved" || t.status === "Terpakai") approved++;
                else if (t.status === "Ditolak") rejected++;
                else pending++;
            });

            document.getElementById('count-total').innerText = total;
            document.getElementById('count-pending').innerText = pending;
            document.getElementById('count-approved').innerText = approved;
            document.getElementById('count-rejected').innerText = rejected;
        }

        function setFilter(filterType) {
            currentFilter = filterType;
            
            document.querySelectorAll('.stat-card').forEach(card => card.classList.remove('active-filter'));
            if (filterType === 'all') document.getElementById('card-all').classList.add('active-filter');
            if (filterType === 'pending') document.getElementById('card-pending').classList.add('active-filter');
            if (filterType === 'approved') document.getElementById('card-approved').classList.add('active-filter');
            if (filterType === 'rejected') document.getElementById('card-rejected').classList.add('active-filter');

            renderTable();
        }

        function filterDataTabel() {
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('ticket-table-body');
            const searchKeyword = document.getElementById('search-input').value.trim().toLowerCase();

            let filtered = allTickets.filter(ticket => {
                if (currentFilter === 'pending') {
                    return ticket.status !== "Approved" && ticket.status !== "Terpakai" && ticket.status !== "Ditolak";
                } else if (currentFilter === 'approved') {
                    return ticket.status === "Approved" || ticket.status === "Terpakai";
                } else if (currentFilter === 'rejected') {
                    return ticket.status === "Ditolak";
                }
                return true; 
            });

            if (searchKeyword !== "") {
                filtered = filtered.filter(ticket => {
                    const kode = ticket.kodeTiket ? ticket.kodeTiket.toLowerCase() : "";
                    const nama = ticket.nama ? ticket.nama.toLowerCase() : "";
                    return kode.includes(searchKeyword) || nama.includes(searchKeyword);
                });
            }

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: #94a3b8;">Tidak ada data tiket yang ditemukan.</td></tr>`;
                return;
            }

            tbody.innerHTML = "";
            filtered.forEach(ticket => {
                const tanggal = new Date(ticket.timestamp).toLocaleString('id-ID');
                
                let statusBadge = `<span class="badge-pending">Pending</span>`;
                if (ticket.status === "Approved") {
                    statusBadge = `<span class="badge-approved">Approved</span>`;
                } else if (ticket.status === "Terpakai") {
                    statusBadge = `<span class="badge-terpakai">Terpakai ✅</span>`;
                } else if (ticket.status === "Ditolak") {
                    statusBadge = `<span class="badge-rejected">Ditolak</span>`;
                }
                
                const kodeDisplay = ticket.kodeTiket && ticket.kodeTiket !== "-" ? ticket.kodeTiket : "-";
                
                const aksiButton = `
                    <div class="action-buttons">
                        <button class="btn-action" onclick="ubahStatus(${ticket.rowId}, 'Approved', '${ticket.nama}', '${ticket.no_hp}')">Approve</button>
                        <button class="btn-reject" onclick="ubahStatus(${ticket.rowId}, 'Ditolak', '${ticket.nama}', '${ticket.no_hp}')">Tolak</button>
                        <button class="btn-delete" onclick="hapusTiket(${ticket.rowId}, '${ticket.nama}')">Hapus</button>
                    </div>
                `;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${tanggal}</td>
                    <td><strong>${ticket.nama}</strong></td>
                    <td>${ticket.no_hp}</td>
                    <td><a href="${ticket.linkBukti}" target="_blank" class="link-bukti">Lihat Foto 🔍</a></td>
                    <td>${statusBadge}</td>
                    <td><code>${kodeDisplay}</code></td>
                    <td>${aksiButton}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function ubahStatus(rowId, statusAksi, nama, noHp) {
            const konfirmasiPesan = statusAksi === 'Approved' 
                ? `Konfirmasi pembayaran tiket atas nama ${nama}? (WhatsApp akan otomatis terbuka)`
                : `Apakah Anda yakin ingin MENOLAK tiket atas nama ${nama}?`;

            if (!confirm(konfirmasiPesan)) return;

            try {
                const res = await fetch(URL_WEB_APP, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: "updateStatus", rowId: rowId, status: statusAksi })
                });
                const result = await res.json();

                if (statusAksi === 'Approved') {
                    const officialKode = result.kodeTiket || "RFC-TKT-XXXX";
                    
                    let formattedHp = noHp.toString().replace(/\D/g, ''); 
                    if (formattedHp.startsWith('0')) {
                        formattedHp = '62' + formattedHp.substring(1);
                    } else if (formattedHp.startsWith('8')) {
                        formattedHp = '62' + formattedHp;
                    }

                    const pesan = `Halo Kak *${nama}*, pembayaran tiket RFC (Ragnarok Fight Club) Anda sudah diverifikasi dan di-approve oleh Admin! 🎉\n\nBerikut adalah Kode Tiket Anda:\n🔑 *${officialKode}*\n\nTunjukkan kode unik ini saat memasuki venue acara ya. Sampai jumpa di arena es & baja! 🥊🔥`;
                    const waUrl = `https://wa.me/${formattedHp}?text=${encodeURIComponent(pesan)}`;
                    window.open(waUrl, '_blank');
                    alert("Tiket berhasil di-approve! Tab WhatsApp pengiriman pesan ke pembeli telah dibuka.");
                } else {
                    alert(`Status tiket atas nama ${nama} berhasil diubah menjadi Ditolak.`);
                }

                await new Promise(resolve => setTimeout(resolve, 1000));
                muatDataTiket(); 

            } catch (error) {
                console.error("Error updating status:", error);
                alert("Terjadi kesalahan saat memproses status.");
            }
        }

        async function hapusTiket(rowId, nama) {
            const konfirmasiHapus = confirm(`⚠️ PERINGATAN!\n\nApakah Anda benar-benar ingin MENGHAPUS data tiket atas nama "${nama}"?\nData yang dihapus tidak dapat dikembalikan.`);
            
            if (!konfirmasiHapus) return;

            try {
                await fetch(URL_WEB_APP, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: "delete", rowId: rowId })
                });

                alert(`Data tiket atas nama ${nama} berhasil dihapus.`);
                await new Promise(resolve => setTimeout(resolve, 1000));
                muatDataTiket(); 

            } catch (error) {
                console.error("Error deleting:", error);
                alert("Terjadi kesalahan saat menghapus data.");
            }
        }
    </script>
</body>
